<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARN-Annuaire | Les fils de Niagara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f9f8;
      color: #14251d;
    }
    header {
      background: white;
      padding: 20px;
      color: #14633d;
      font-weight: bold;
      font-size: 22px;
    }
    .hero {
      background: #145735;
      color: white;
      padding: 70px 25px;
      text-align: center;
    }
    .hero h1 { font-size: 36px; }
    .hero span { color: #80edab; }
    main { padding: 30px 20px; }
    .card {
      background: white;
      border: 1px solid #e1e7e3;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <header>ARN — Les fils de Niagara</header>
  <section class="hero">
    <h1>Trouvez un fils de Niagara<br>
      <span>pour chaque métier.</span>
    </h1>
    <p>Plombiers, électriciens, commerçants...</p>
  </section>
  <main>
    <h2>Catégories professionnelles</h2>
    <div class="card">Plomberie</div>
    <div class="card">Électricité</div>
    <div class="card">Menuiserie</div>
    <div class="card">Commerce</div>
    <div class="card">Couture</div>
    <div class="card">Transport</div>
  </main>
</body>
</html>
